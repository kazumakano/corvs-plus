[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corvs"
version = "1.0.0"
description = "Sample code of CorVS+"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "einops>=0.8.2",
    "lightning>=2.6.1",
    "omegaconf>=2.3.0",
    "pandas>=3.0.1",
    "pytorch-optimizer>=3.10.0",
    "safetensors>=0.7.0",
    "torch==2.9.1",
    "torchao==0.15.0",
    "torchtune>=0.6.1",
]
